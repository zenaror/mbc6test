# Manual build-and-publish workflow. Deliberately NOT triggered on
# push/PR — kept as a manual, on-demand action so ordinary commits
# don't create a release for every change.
#
# Run it from the repo's Actions tab ("Run workflow"). It builds the
# default (non-destructive) ROM, runs the static verifier, and
# publishes a GitHub release tagged with the 7-character short commit
# hash — the same hash the ROM itself shows on screen
# (see src/build_info.asm / docs/screen-guide.md), so a release tag
# and a screenshot from that build can always be matched up.
#
# This repo's canonical history is mirrored to Gitea for backup;
# GitHub is where releases are published from.

name: Build and publish release

on:
  workflow_dispatch: {}

permissions:
  contents: write

env:
  RGBDS_VERSION: "1.0.3"

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install RGBDS
        run: |
          set -eu
          curl -sL -o rgbds.tar.xz \
            "https://github.com/gbdev/rgbds/releases/download/v${RGBDS_VERSION}/rgbds-linux-x86_64.tar.xz"
          mkdir -p "$HOME/rgbds"
          tar -xf rgbds.tar.xz -C "$HOME/rgbds"
          echo "$HOME/rgbds" >> "$GITHUB_PATH"

      - name: Build (default/safe configuration)
        run: make

      - name: Static verification
        run: make verify

      - name: Determine build id
        id: build_id
        run: echo "sha7=$(git rev-parse --short=7 HEAD)" >> "$GITHUB_OUTPUT"

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.build_id.outputs.sha7 }}
          name: ${{ steps.build_id.outputs.sha7 }}
          target_commitish: ${{ github.sha }}
          body: |
            Automated build from commit `${{ steps.build_id.outputs.sha7 }}`.
            Default (non-destructive) configuration — see README.md
            for how to build with `ENABLE_DESTRUCTIVE_FLASH_TESTS=1`.
            See docs/screen-guide.md to read the on-screen results.
          files: |
            build/mbc6-test.gbc
            build/mbc6-test.map
            build/mbc6-test.sym
